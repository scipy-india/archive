<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tag preview</title>
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); padding: var(--space-5); }
  .tag { background: var(--secondary-bg); color: var(--on-surface); border-radius: var(--radius-pill); font-size: 22px; font-weight: 600; line-height: 1.2; padding: 12px 22px; white-space: nowrap; }
  .label { color: var(--primary); font-size: 22px; font-weight: 600; line-height: 1.2; }
</style>
</head>
<body>
<div class="row">
  <span class="tag">Call for proposals</span>
  <span class="label">Call for proposals</span>
</div>
</body>
</html>
