<!-- @dsCard group="Content" height=230 subtitle="Website card" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card preview</title>
<style>
  body { margin: 0; background: var(--background); color: var(--text-base); font-family: var(--font-sans); }
  .wrap { padding: var(--space-5); }
  .card { max-width: 420px; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-card); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .card h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.65; color: var(--text-base); }
  .card p { margin: 0; font-size: 16px; line-height: 1.65; }
  .card a { align-self: flex-start; border: 1px solid var(--secondary); color: var(--secondary); border-radius: var(--radius-sm); padding: 5px 12px 7px; text-decoration: none; font-size: 16px; }
  .card a:hover { background: var(--secondary); color: var(--secondary-text); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h3>Call for proposals (CFP)</h3>
    <p>Now open! We are looking for proposals for workshops, talks, and posters on scientific computing, research software, and AI/ML applications with a scientific flavour.</p>
    <a href="#">Submit your proposal</a>
  </div>
</div>
</body>
</html>
