<!-- @dsCard group="Actions" height=164 subtitle="Solid, outline, pill, call-to-action" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button preview</title>
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding: var(--space-5); }
  a { text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
  .solid, .outline { border: 1px solid; border-radius: var(--radius-sm); padding: 5px 12px 7px; font-size: 16px; line-height: 1.5; }
  .solid { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  .solid:hover { background: var(--primary-highlight); border-color: var(--primary-highlight); }
  .outline { border-color: var(--secondary); color: var(--secondary); }
  .outline:hover { background: var(--secondary); color: var(--secondary-text); }
  .pill { border: 1px solid var(--border); color: var(--text-base); border-radius: var(--radius-pill); padding: 6.4px 14.4px; font-size: 14.4px; line-height: 1.65; }
  .pill:hover { border-color: var(--primary); color: var(--primary); }
  .cta { background: var(--primary); color: var(--on-background); border-radius: var(--radius-pill); padding: 16px 28px; font-size: 22px; font-weight: 700; line-height: 1.2; }
  .solid:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .outline:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
  .pill:focus-visible, .cta:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="row">
  <a class="solid" href="#">Submit your proposal</a>
  <a class="outline" href="#">Past editions</a>
  <a class="pill" href="#">+ Add to calendar</a>
  <a class="cta" href="#">Submit your proposal <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>
</body>
</html>
