<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EventLine preview</title>
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-sans); }
  .line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) 36px; padding: var(--space-5); font-size: 27px; font-weight: 600; line-height: 1.25; color: var(--on-surface); }
  .item { display: flex; align-items: center; gap: var(--space-3); }
  svg { width: 30px; height: 30px; color: var(--primary); flex: none; }
</style>
</head>
<body>
<div class="line">
  <div class="item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
    <span>19th–20th December 2026</span>
  </div>
  <div class="item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.6a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.4" r="2.6"/></svg>
    <span>IIT Madras, Chennai</span>
  </div>
</div>
</body>
</html>
