<!-- @dsCard group="Content" height=76 subtitle="Square post footer, at half size" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Footer preview</title>
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-sans); }
  .wrap { padding: var(--space-5); max-width: 620px; }
  .footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding-top: 13px; border-top: 1px solid var(--post-rule); font-size: 11px; line-height: 1.3; }
  .when { display: flex; align-items: center; gap: 7px; color: var(--post-text); }
  .when b { color: var(--on-surface); }
  .link { display: flex; align-items: center; gap: 5px; font-weight: 700; color: var(--primary); }
  svg { width: 14px; height: 14px; flex: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="footer">
    <div class="when">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--post-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Closes <b>1st November 2026, 23:59 IST</b></span>
    </div>
    <div class="link">
      <span>cfp.scipy.in/scipy-india-2026</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>
</div>
</body>
</html>
